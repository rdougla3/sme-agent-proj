requires-python = ">=3.11,<3.12"
dependencies = [
    "cloud-sql-python-connector[pg8000]>=1.23,<2",
    "google-auth>=2.28,<3",
    "google-cloud-storage>=3,<4",
    "google-genai>=1,<3",
    "httpx>=0.28,<1",
